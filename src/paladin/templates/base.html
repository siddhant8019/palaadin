<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PALADIN{% endblock %}</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=clash-grotesk@500,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root { --paper:#F7F4EE; --ink:#17150F; --card:#FFFFFF; --line:#E3DCCF; --muted:#6B6660; --err:#B3261E; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:15px/1.5 "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:28px; gap:16px; flex-wrap:wrap; }
  h1, h2, h3 { font-family:"Clash Grotesk", "Satoshi", -apple-system, Helvetica, Arial, sans-serif; font-weight:600; margin:0; letter-spacing:-0.01em; }
  h1 { font-size:28px; } h2 { font-size:20px; margin-bottom:12px; } h3 { font-size:17px; }
  a { color:var(--ink); }
  nav a, nav button { margin-left:16px; color:var(--muted); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
  .muted { color:var(--muted); }
  .mono, code { font-family:"JetBrains Mono", ui-monospace, Menlo, monospace; font-size:12.5px; }
  .btn { display:inline-block; background:var(--ink); color:var(--paper); border:1px solid var(--ink); border-radius:8px;
         padding:9px 16px; font:inherit; font-weight:500; cursor:pointer; text-decoration:none; }
  .btn.ghost { background:transparent; color:var(--ink); }
  .linkbtn { background:none; border:none; padding:0; font:inherit; cursor:pointer; text-decoration:underline; }
  .err { color:var(--err); }
  .msg { border:1px solid var(--line); background:var(--card); padding:10px 14px; border-radius:8px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:500; color:var(--muted); font-size:13px; }
  input[type=text], input[type=password], textarea { width:100%; font:inherit; padding:9px 10px; border:1px solid var(--line);
         border-radius:8px; background:var(--card); color:var(--ink); }
  textarea { min-height:90px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  ul.clean { list-style:none; padding:0; margin:0; }
  ul.clean li { padding:6px 0; border-bottom:1px solid var(--line); }
  ul.clean li:last-child { border-bottom:none; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PALADIN</h1>
    {% if user %}
    <nav class="row">
      <a href="/">Lists</a><a href="/queue">Approval queue</a><a href="/export.csv">Export CSV</a>
      <form method="post" action="/logout" style="display:inline"><button class="linkbtn muted" style="margin-left:16px">Sign out</button></form>
    </nav>
    {% endif %}
  </header>
  {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
